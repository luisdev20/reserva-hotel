<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Experiencia gastronómica andina">

<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e5d4c3"/><stop offset="1" stop-color="#d2bba7"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8d6247"/><stop offset="1" stop-color="#6e4a35"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9a58e"/><stop offset="1" stop-color="#f1dcc9"/>
  </linearGradient>
  <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4e8da"/><stop offset="1" stop-color="#dbc2ab"/>
  </linearGradient>
  <radialGradient id="vin" cx="50%" cy="45%" r="72%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".28"/>
  </radialGradient>
  <filter id="grano" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
  </filter>
  <filter id="suave"><feGaussianBlur stdDeviation="16"/></filter>
</defs>

<rect width="1200" height="800" fill="url(#wall)"/>

