<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Experiencia gastronómica andina">

<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e5d4c3"/><stop offset="1" stop-color="#d2bba7"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8d6247"/><stop offset="1" stop-color="#6e4a35"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c9a58e"/><stop offset="1" stop-color="#f1dcc9"/>
  </linearGradient>
  <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4e8da"/><stop offset="1" stop-color="#dbc2ab"/>
  </linearGradient>
  <radialGradient id="vin" cx="50%" cy="45%" r="72%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".28"/>
  </radialGradient>
  <filter id="grano" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
  </filter>
  <filter id="suave"><feGaussianBlur stdDeviation="16"/></filter>
</defs>

<rect width="1200" height="800" fill="url(#wall)"/>

<g>
  <rect x="410" y="70" width="380" height="320" rx="6" fill="#2c2a26"/>
  <rect x="420" y="80" width="360" height="300" fill="url(#sky)"/>
  <clipPath id="ventana"><rect x="420" y="80" width="360" height="300"/></clipPath>
  
<g clip-path="url(#ventana)">
  <rect x="420" y="80" width="360" height="300" fill="url(#sky)"/>
  <circle cx="679" cy="152" r="22" fill="#f6d9b4" opacity=".9"/>
  <path d="M420,380 L485,224 L542,290 L600,194 L672,380 Z"
        fill="#6c4a44" opacity=".92"/>
  <path d="M535,380 L607,245 L665,296 L715,230 L780,380 Z"
        fill="#956d64" opacity=".9"/>
  <path d="M449,314 Q528,284 607,320 T758,302"
        fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="6"/>
  <path d="M463,338 q14,-36 28,0 q14,-46 28,0 q14,-32 28,0" fill="none" stroke="#2d3a2c" stroke-opacity=".35" stroke-width="4"/>
</g>
  <rect x="420" y="80" width="360" height="300" fill="none" stroke="#2c2a26" stroke-width="12"/>
  <line x1="600" y1="80" x2="600" y2="380" stroke="#2c2a26" stroke-width="9"/>
  <line x1="420" y1="230" x2="780" y2="230" stroke="#2c2a26" stroke-width="9"/>
  
</g>

<rect y="560" width="1200" height="240" fill="url(#floor)"/>
<g>
  <ellipse cx="600" cy="650" rx="300" ry="50" fill="#2b2118" opacity=".2"/>
  <ellipse cx="600" cy="570" rx="300" ry="96" fill="#fff9f2"/>
  <ellipse cx="600" cy="560" rx="230" ry="70" fill="#dbc2ab"/>
  <ellipse cx="600" cy="550" rx="150" ry="46" fill="#6e2a2e" opacity=".2"/>
  <ellipse cx="600" cy="548" rx="92" ry="28" fill="#c9a66b" opacity=".7"/>
  <g fill="#6e2a2e">
    <circle cx="560" cy="542" r="10"/><circle cx="590" cy="536" r="8"/><circle cx="620" cy="542" r="11"/>
    <circle cx="642" cy="536" r="7"/><circle cx="578" cy="554" r="7"/><circle cx="612" cy="556" r="9"/>
  </g>
  <path d="M520,530 q40,-22 80,0 q40,22 80,0" fill="none" stroke="#4d1d20" stroke-width="3" opacity=".7"/>
  <g>
    <path d="M760,470 l40,0 l-8,70 q-2,16 -12,16 q-10,0 -12,-16 Z" fill="#c9a66b" opacity=".9"/>
    <path d="M760,470 q20,-20 40,0" fill="none" stroke="#c9a66b" stroke-width="4"/>
    <line x1="780" y1="556" x2="780" y2="600" stroke="#c9a66b" stroke-width="4"/>
  </g>
  <g>
    <path d="M400,500 l30,0 l-6,54 q-2,14 -9,14 q-7,0 -9,-14 Z" fill="#c9a66b" opacity=".8"/>
    <line x1="415" y1="568" x2="415" y2="600" stroke="#c9a66b" stroke-width="3"/>
  </g>
  <path d="M450,620 q150,40 300,0" fill="none" stroke="#5a3b2a" stroke-width="6"/>
</g>
<g opacity=".5">
  <circle cx="930" cy="420" r="46" fill="#f6d9b4" filter="url(#suave)"/>
  <path d="M902,420 q28,-28 56,0 q-28,28 -56,0" fill="#c9a66b" opacity=".6"/>
</g>

<rect width="1200" height="800" filter="url(#grano)" opacity=".55"/>
<rect width="1200" height="800" fill="url(#vin)"/>
</svg>