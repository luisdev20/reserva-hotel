<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Cordillera de los Andes al atardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151C27"/>
      <stop offset="45%" stop-color="#2A2F3E"/>
      <stop offset="78%" stop-color="#5C4A3F"/>
      <stop offset="100%" stop-color="#C9A66B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#E8C98A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8C98A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="range3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B4557"/>
      <stop offset="100%" stop-color="#2A3140"/>
    </linearGradient>
    <linearGradient id="range2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262C38"/>
      <stop offset="100%" stop-color="#1C202A"/>
    </linearGradient>
    <linearGradient id="range1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171B23"/>
      <stop offset="100%" stop-color="#11141A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#sky)"/>
  <rect width="1200" height="640" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#F5F1E8" opacity="0.7">
    <circle cx="120" cy="70" r="1.4"/>
    <circle cx="260" cy="120" r="1"/>
    <circle cx="430" cy="60" r="1.6"/>
    <circle cx="610" cy="95" r="1"/>
    <circle cx="820" cy="55" r="1.3"/>
    <circle cx="980" cy="110" r="1"/>
    <circle cx="1100" cy="70" r="1.5"/>
    <circle cx="60" cy="180" r="1"/>
    <circle cx="1150" cy="160" r="1.2"/>
  </g>

  <!-- back range -->
  <path fill="url(#range3)" d="M0 360 L90 300 L170 340 L260 260 L340 330 L430 280 L520 350 L610 300 L700 355 L800 290 L900 345 L1000 300 L1090 350 L1200 310 L1200 640 L0 640 Z"/>

  <!-- mid range -->
  <path fill="url(#range2)" d="M0 430 L110 360 L210 415 L320 330 L410 400 L520 345 L630 420 L740 350 L850 410 L960 340 L1070 405 L1200 355 L1200 640 L0 640 Z"/>

  <!-- front range with snow caps -->
  <path fill="url(#range1)" d="M0 500 L140 400 L230 470 L360 380 L470 460 L590 390 L700 465 L830 385 L940 455 L1060 395 L1200 460 L1200 640 L0 640 Z"/>
  <g fill="#F5F1E8" opacity="0.9">
    <path d="M140 400 L160 420 L120 424 Z"/>
    <path d="M360 380 L382 402 L340 406 Z"/>
    <path d="M590 390 L610 410 L568 414 Z"/>
    <path d="M830 385 L850 406 L810 410 Z"/>
    <path d="M1060 395 L1080 415 L1040 419 Z"/>
  </g>

  <!-- lodge windows glowing on the hillside -->
  <g fill="#E8C98A">
    <rect x="248" y="452" width="7" height="10" rx="1" opacity="0.9"/>
    <rect x="266" y="460" width="7" height="10" rx="1" opacity="0.7"/>
    <rect x="700" y="452" width="7" height="10" rx="1" opacity="0.85"/>
    <rect x="718" y="462" width="7" height="10" rx="1" opacity="0.6"/>
    <rect x="900" y="440" width="7" height="10" rx="1" opacity="0.8"/>
  </g>
</svg>
