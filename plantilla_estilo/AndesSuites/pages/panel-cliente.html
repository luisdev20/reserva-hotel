<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Huésped — Andes Suites</title>
<link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  body{background:var(--cream)}
  .panel-shell{display:flex;min-height:100vh}
  .panel-sidebar{width:250px;background:var(--night);color:var(--cream);flex-shrink:0;display:flex;flex-direction:column}
  .panel-sidebar .brand{padding:26px 24px;border-bottom:1px solid rgba(245,241,232,.1)}
  .panel-sidebar .brand img{height:30px}
  .panel-sidebar nav{padding:18px 12px;flex:1}
  .panel-sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:6px;color:var(--stone);font-size:14px;margin-bottom:4px}
  .panel-sidebar nav a.active{background:rgba(201,166,107,.15);color:var(--gold)}
  .panel-sidebar nav a i{width:18px;text-align:center}
  .panel-sidebar .logout{padding:18px 24px;border-top:1px solid rgba(245,241,232,.1)}
  .panel-sidebar .logout a{color:var(--stone);font-size:13.5px;display:flex;align-items:center;gap:10px}
  .panel-main{flex:1;padding:36px 44px}
  .panel-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
  .panel-topbar h1{font-size:24px}
  .role-pill{background:var(--gold);color:var(--night-2);font-size:12px;font-weight:600;letter-spacing:.5px;padding:6px 14px;border-radius:20px}
  .placeholder-card{background:#fff;border:1px dashed var(--stone);border-radius:8px;padding:60px 30px;text-align:center;color:var(--ink-soft)}
  .placeholder-card i{font-size:30px;color:var(--gold);margin-bottom:14px;display:block}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}
  .kpi-card{background:#fff;border:1px solid var(--stone);border-radius:8px;padding:20px}
  .kpi-card span{display:block;font-size:12px;color:var(--ink-soft);letter-spacing:.4px}
  .kpi-card strong{display:block;font-family:var(--serif);font-size:26px;color:var(--night);margin-top:6px}
  @media (max-width:900px){.panel-sidebar{display:none}.kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="panel-shell">
  <aside class="panel-sidebar">
    <div class="brand"><img src="../assets/img/logo.svg" alt="Andes Suites"></div>
    <nav>
      <a href="#" class="active"><i class="fa-solid fa-gauge"></i> Resumen</a>
      <a href="#"><i class="fa-solid fa-bed"></i> Mis reservas</a>
      <a href="#"><i class="fa-solid fa-calendar-plus"></i> Nueva reserva</a>
      <a href="#"><i class="fa-solid fa-user"></i> Mi perfil</a>
    </nav>
    <div class="logout"><a href="#" id="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión</a></div>
  </aside>

  <main class="panel-main">
    <div class="panel-topbar">
      <div>
        <h1>Mi cuenta</h1>
        <p style="color:var(--ink-soft);font-size:14px;margin-top:4px">Bienvenido(a), <span id="nombre-usuario">Huésped</span></p>
      </div>
      <span class="role-pill">HUÉSPED</span>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card"><span>Reservas activas</span><strong>0</strong></div>
      <div class="kpi-card"><span>Próxima estadía</span><strong>—</strong></div>
      <div class="kpi-card"><span>Noches hospedado</span><strong>0</strong></div>
      <div class="kpi-card"><span>Sede favorita</span><strong>—</strong></div>
    </div>

    <div class="placeholder-card">
      <i class="fa-solid fa-hammer"></i>
      <h3 style="margin-bottom:8px">Este panel está en construcción</h3>
      <p>Aquí podrás ver tus reservas, crear una nueva y actualizar tu perfil de huésped.</p>
    </div>
  </main>
</div>

<script src="../assets/js/db.js"></script>
<script>
  const sesion = AndesDB.getSession();
  if (!sesion || sesion.rol !== 'cliente') {
    window.location.href = 'login.html';
  } else {
    document.getElementById('nombre-usuario').textContent = sesion.nombre || sesion.usuario;
  }
  document.getElementById('btn-logout').addEventListener('click', (e) => {
    e.preventDefault();
    AndesDB.clearSession();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
