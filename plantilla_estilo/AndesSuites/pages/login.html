<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Andes Suites</title>
<link rel="icon" href="../assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --night:#1B2430;--night-2:#141B24;--cream:#F5F1E8;--stone:#E4DCC9;
    --gold:#C9A66B;--gold-2:#B58F52;--ink:#22262B;--ink-soft:#6b6f73;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Work Sans',Arial,sans-serif;min-height:100vh;color:var(--cream);
    background:var(--night) url('../assets/img/hero-andes.svg') bottom/cover no-repeat;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  }
  .login-header{text-align:center;margin-bottom:26px}
  .login-header img{height:52px;margin-bottom:8px}
  .login-header p{color:var(--stone);font-size:12.5px;letter-spacing:2px;text-transform:uppercase}

  .login-card{background:#fff;color:var(--ink);border-radius:6px;padding:36px 38px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .login-card h2{font-family:'Fraunces',serif;font-size:21px;color:var(--night);margin-bottom:22px;text-align:center;letter-spacing:.3px}

  .role-selector{display:flex;gap:8px;margin-bottom:24px}
  .role-btn{flex:1;padding:12px 6px;border:1px solid var(--stone);border-radius:6px;background:#FBF9F4;
    color:var(--ink-soft);font-size:12px;font-weight:600;letter-spacing:.6px;
    cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
  .role-btn i{font-size:17px}
  .role-btn.active{background:var(--night);border-color:var(--night);color:var(--gold)}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .input-icon{position:relative}
  .input-icon i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--gold-2);font-size:14px}
  .input-icon input{width:100%;padding:12px 14px 12px 38px;border:1px solid var(--stone);border-radius:6px;
    font-family:inherit;font-size:14.5px;color:var(--ink);outline:none;background:#FBF9F4}
  .input-icon input:focus{border-color:var(--gold)}

  .btn-submit{width:100%;padding:13px;background:var(--gold);border:none;border-radius:6px;
    font-size:14.5px;font-weight:600;letter-spacing:1px;color:var(--night-2);cursor:pointer;margin-top:6px;transition:background .2s}
  .btn-submit:hover{background:var(--gold-2)}

  .error-msg{display:none;background:#fdf0ef;border:1px solid #e6b3af;border-radius:6px;
    padding:10px 14px;color:#a4302a;font-size:13px;margin-top:14px;text-align:center}
  .error-msg.visible{display:block}

  .demo-info{margin-top:20px;background:#F5F1E8;border-radius:6px;padding:12px 14px;font-size:12px;color:var(--ink-soft);line-height:1.7}
  .demo-info strong{color:var(--night)}

  .btn-volver{margin-top:24px;display:inline-flex;align-items:center;gap:8px;color:var(--stone);
    font-size:13.5px;letter-spacing:.4px}
  .btn-volver:hover{color:var(--gold)}
</style>
</head>
<body>

  <div class="login-header">
    <img src="../assets/img/logo.svg" alt="Andes Suites">
    <p>Sistema de reservas</p>
  </div>

  <div class="login-card">
    <h2>INICIAR SESIÓN</h2>

    <div class="role-selector">
      <button class="role-btn active" data-role="cliente" onclick="seleccionarRol('cliente', this)">
        <i class="fa-solid fa-user"></i> Huésped
      </button>
      <button class="role-btn" data-role="recepcionista" onclick="seleccionarRol('recepcionista', this)">
        <i class="fa-solid fa-concierge-bell"></i> Recepción
      </button>
      <button class="role-btn" data-role="admin" onclick="seleccionarRol('admin', this)">
        <i class="fa-solid fa-crown"></i> Admin
      </button>
    </div>

    <form onsubmit="event.preventDefault(); iniciarSesion();">
      <div class="field">
        <label>Usuario</label>
        <div class="input-icon">
          <i class="fa-solid fa-at"></i>
          <input type="text" id="inp-usuario" placeholder="Tu usuario" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="inp-pass" placeholder="Tu contraseña" autocomplete="current-password">
        </div>
      </div>
      <button class="btn-submit" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
      <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos.</div>
    </form>

    <div class="demo-info">
      <strong>Credenciales de prueba</strong><br>
      Huésped: <strong>huesped / 1234</strong><br>
      Recepción: <strong>recepcion / 1234</strong><br>
      Admin: <strong>admin / 1234</strong>
    </div>
  </div>

  <a class="btn-volver" href="../index.html"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>

  <script src="../assets/js/db.js"></script>
  <script>
    let rolActual = 'cliente';
    const destinos = {
      cliente: 'panel-cliente.html',
      recepcionista: 'panel-recepcion.html',
      admin: 'panel-admin.html',
    };

    function seleccionarRol(rol, btn) {
      rolActual = rol;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('error-msg').classList.remove('visible');
    }

    function iniciarSesion() {
      const usuario = document.getElementById('inp-usuario').value.trim();
      const pass    = document.getElementById('inp-pass').value;
      const errEl   = document.getElementById('error-msg');

      const encontrado = AndesDB.login(usuario, pass, rolActual);
      if (encontrado) {
        AndesDB.setSession(encontrado);
        window.location.href = destinos[rolActual];
      } else {
        errEl.classList.add('visible');
      }
    }
  </script>
</body>
</html>
